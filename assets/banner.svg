<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Dynamic Glowing Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Soft Ambient Lights -->
    <radialGradient id="ambientOrb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientOrb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientOrb3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      /* Dynamic Keyframe Animations */
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.85; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
      }

      .floating-bg-1 {
        animation: floatSlow1 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-bg-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 20, 15;
        animation: streamFlow 12s linear infinite;
      }
      .interactive-pill {
        animation: badgePulse 4s ease-in-out infinite;
      }

      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subdued Grid Matrix Pattern -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Ambient Dynamic Lighting Spheres (Background Layer Only) -->
  <circle cx="180" cy="130" r="260" fill="url(#ambientOrb1)" class="pulsing-orb"/>
  <circle cx="1020" cy="280" r="280" fill="url(#ambientOrb2)" class="pulsing-orb" style="animation-delay: -3s;"/>
  <circle cx="600" cy="210" r="200" fill="url(#ambientOrb3)" class="pulsing-orb" style="animation-delay: -1.5s;"/>

  <!-- Background Dynamic Circuit / Flow Lines -->
  <g opacity="0.4" fill="none">
    <path class="stream-line" d="M 50 180 Q 250 80 450 160 T 850 140 T 1150 200" stroke="#38bdf8" stroke-width="2"/>
    <path class="stream-line" d="M 80 280 Q 300 380 550 260 T 950 300 T 1120 220" stroke="#818cf8" stroke-width="2" style="animation-duration: 9s; animation-direction: reverse;"/>
  </g>

  <!-- Subtle Dynamic Floating Background Badges (Positioned away from center text) -->
  <g class="floating-bg-1" opacity="0.65">
    <!-- Top-Right Badge: SECRETS_SYNC -->
    <g transform="translate(930, 48)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" class="interactive-pill"/>
      <circle cx="20" cy="19" r="6" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="36" y="24" fill="#e2e8f0" font-size="12" font-weight="600" class="font-mono">ENV_SYNC: ACTIVE</text>
    </g>
    <!-- Bottom-Left Badge: ZERO_TRUST -->
    <g transform="translate(65, 335)">
      <rect width="175" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" class="interactive-pill"/>
      <circle cx="18" cy="18" r="5" fill="#10b981" filter="url(#softGlow)"/>
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="font-mono">ZERO-TRUST: E2EE</text>
    </g>
  </g>

  <g class="floating-bg-2" opacity="0.65">
    <!-- Top-Left Badge: .ENVRC SAFE -->
    <g transform="translate(70, 52)">
      <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" class="interactive-pill"/>
      <circle cx="18" cy="18" r="5" fill="#c084fc" filter="url(#softGlow)"/>
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="font-mono">VAULT ENGINE: OK</text>
    </g>
    <!-- Bottom-Right Badge: ROTATION -->
    <g transform="translate(940, 330)">
      <rect width="175" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" class="interactive-pill"/>
      <circle cx="18" cy="18" r="5" fill="#f59e0b" filter="url(#softGlow)"/>
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="font-mono">AUTO-ROTATION 24H</text>
    </g>
  </g>

  <!-- Outer Frame Gradient Glow Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- ================= FOREGROUND (HIGH CONTRAST & NEVER HIDDEN) ================= -->
  <g id="foreground" text-anchor="middle" class="font-sans">

    <!-- Top Category Pill / Kicker -->
    <g transform="translate(600, 78)">
      <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="1.5"/>
      <text y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2" class="font-mono">★ CURATED DEVOPS ECOSYSTEM ★</text>
    </g>

    <!-- Main Repository Title with Linear Gradient -->
    <text x="600" y="156" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Environment Variable Managers
    </text>
    <text x="600" y="156" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Environment Variable Managers
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" fill="#cbd5e1" font-size="18" font-weight="500" letter-spacing="0.2">
      The Ultimate Guide to Secrets Management, .env Workflows &amp; Cloud Key Vaults
    </text>

    <!-- Tagline description -->
    <text x="600" y="232" fill="#94a3b8" font-size="14.5" font-weight="400">
      Enterprise SaaS Platforms • Self-Hosted Open-Source • GitOps • Dynamic Credentials • Zero-Trust
    </text>

    <!-- Feature Pillars Bar / Cards -->
    <g transform="translate(600, 290)">
      <!-- Card 1: Cloud & SaaS -->
      <g transform="translate(-360, 0)">
        <rect x="-105" y="-24" width="210" height="48" rx="12" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="1.2"/>
        <text y="5" fill="#f8fafc" font-size="13" font-weight="600">☁️ Managed SaaS</text>
        <text y="20" fill="#94a3b8" font-size="10.5">Doppler, Vault, AWS</text>
      </g>

      <!-- Card 2: Open Source -->
      <g transform="translate(-120, 0)">
        <rect x="-105" y="-24" width="210" height="48" rx="12" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="1.2"/>
        <text y="5" fill="#f8fafc" font-size="13" font-weight="600">🔓 Self-Hosted OSS</text>
        <text y="20" fill="#94a3b8" font-size="10.5">Infisical, OpenBao, SOPS</text>
      </g>

      <!-- Card 3: GitOps & Local -->
      <g transform="translate(120, 0)">
        <rect x="-105" y="-24" width="210" height="48" rx="12" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="1.2"/>
        <text y="5" fill="#f8fafc" font-size="13" font-weight="600">⚡ Developer Flow</text>
        <text y="20" fill="#94a3b8" font-size="10.5">dotenvx, direnv, mise</text>
      </g>

      <!-- Card 4: Kubernetes & IAM -->
      <g transform="translate(360, 0)">
        <rect x="-105" y="-24" width="210" height="48" rx="12" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="1.2"/>
        <text y="5" fill="#f8fafc" font-size="13" font-weight="600">🛡️ Cloud Security</text>
        <text y="20" fill="#94a3b8" font-size="10.5">ESO, Sealed Secrets, KMS</text>
      </g>
    </g>

    <!-- Bottom Metrics Pill -->
    <g transform="translate(600, 368)">
      <text y="0" fill="#64748b" font-size="12" font-weight="500" class="font-mono">
        ENTERPRISE PRICING AUDITED • 15+ OPEN-SOURCE PROJECTS RANKED BY STARS • 100% INDEPENDENT
      </text>
    </g>

  </g>
</svg>
